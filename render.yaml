services:
  - type: web
    name: earthinsider-media-renderer
    env: docker
    plan: free # 512MB RAM — see README's "Render free plan" section for the caveats and when to upgrade
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DEFAULT_SPEED
        value: 1.00
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false # set manually in the Render dashboard — same account you already use for the Flux image node
      - key: CLOUDFLARE_API_TOKEN
        sync: false # set manually in the Render dashboard — secret, don't commit it
      - key: CLOUDFLARE_TTS_MODEL
        value: "@cf/myshell-ai/melotts"
      - key: AUTO_CLEANUP_MINUTES
        value: 30
      - key: BLUESKY_IDENTIFIER
        value: earthinsider.bsky.social
      - key: BLUESKY_PASSWORD
        sync: false
      - key: TUMBLR_CONSUMER_KEY
        sync: false
      - key: TUMBLR_CONSUMER_SECRET
        sync: false
      - key: TUMBLR_ACCESS_TOKEN
        sync: false
      - key: TUMBLR_ACCESS_SECRET
        sync: false
      - key: TUMBLR_BLOG
        value: earthinsider.tumblr.com
