services:
  - type: web
    name: earthinsider-media-renderer
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DEFAULT_SPEED
        value: 1.00
      - key: DEFAULT_VOICE
        value: en-US-ChristopherNeural
      - key: AUTO_CLEANUP_MINUTES
        value: 30
      - key: BLUESKY_IDENTIFIER
        value: earthinsider.bsky.social
      - key: BLUESKY_PASSWORD
        sync: false
      - key: TUMBLR_CONSUMER_KEY
        sync: false
      - key: TUMBLR_CONSUMER_SECRET
        sync: false
      - key: TUMBLR_ACCESS_TOKEN
        sync: false
      - key: TUMBLR_ACCESS_SECRET
        sync: false
      - key: TUMBLR_BLOG
        value: earthinsider.tumblr.com
