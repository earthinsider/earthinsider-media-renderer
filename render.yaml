services:
  - type: web
    name: earthinsider-media-renderer
    env: docker
    plan: free # 512MB RAM — see README's "Render free plan" section for the caveats and when to upgrade
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DEFAULT_SPEED
        value: 1.12
      - key: DEFAULT_VOICE
        value: af_heart
      - key: KOKORO_DTYPE
        value: q4 # lighter than q8 — trades a little voice quality for headroom under 512MB; bump to q8/fp32 once on a paid plan
      - key: AUTO_CLEANUP_MINUTES
        value: 30
